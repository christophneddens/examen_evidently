services:
  monitor-script:
    build: .
    volumes:
      - .:/app

  monitor-ui:
    build: .
    command: evidently ui --workspace /app/bike_sharing_monitoring --host 0.0.0.0 --port 8000
    volumes:
      - ./bike_sharing_monitoring:/app/bike_sharing_monitoring
    ports:
      - "8000:8000"
    depends_on:
      monitor-script:
        condition: service_completed_successfully
